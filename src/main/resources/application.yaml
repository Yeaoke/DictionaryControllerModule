spring:
    datasource:
        url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dsa}
        username: ${POSTGRES_USERNAME}
        password: ${POSTGRES_PASSWORD}

    flyway:
        locations: classpath:db/migrations
        default-schema: data
        schemas:
            - data
            - dsa_data_load
        baseline-on-migrate: false

nsi:
    minzdrav:
        base-url: https://nsi.rosminzdrav.ru
        user-key: ${NSI_USER_KEY}