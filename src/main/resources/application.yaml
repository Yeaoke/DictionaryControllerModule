spring:
    config:
        import: classpath:dictionaries.yaml
    datasource:
        url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dsa}
        username: ${POSTGRES_USERNAME}
        password: ${POSTGRES_PASSWORD}

    flyway:
        locations: classpath:db/migrations
        default-schema: data
        schemas:
            - data
            - dsa_data_load
        baseline-on-migrate: false

    batch:
        job:
            enabled: false
        jdbc:
            initialize-schema: never

nsi:
    minzdrav:
        base-url: ${NSI_BASE_URL:https://nsi.rosminzdrav.ru/port}
        user-key: ${NSI_USER_KEY:}
        trust-store: ${NSI_TRUST_STORE:certs/nsi-truststore.p12}
        trust-store-password: ${NSI_TRUST_STORE_PASSWORD}
